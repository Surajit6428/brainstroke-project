<!DOCTYPE html>
<html>

<head>

    <title>Prediction History</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6f9;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #4facfe;
            color: white;
        }

        tr:hover {
            background: #f2f7ff;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .high {
            background: #ffe5e5;
            color: #e74c3c;
        }

        .low {
            background: #eafaf1;
            color: #27ae60;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            text-decoration: none;
            color: #4facfe;
            font-weight: bold;
            font-size: 16px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Prediction History</h2>

        <table>

            <tr>
                <th>#</th>
                <th>Machine Learning Model</th>
                <th>Status</th>
            </tr>

            {% for item in data %}

            <tr>

                <td>{{loop.index}}</td>

                <td>{{item.model}}</td>

                <td>

                    {% if item.prediction == 1 %}

                    <span class="badge high">High</span>

                    {% else %}

                    <span class="badge low">Low</span>

                    {% endif %}

                </td>

            </tr>

            {% endfor %}

        </table>

        <div class="back">

            <a href="/dashboard">⬅ Back to Dashboard</a>

        </div>

    </div>

</body>

</html>
