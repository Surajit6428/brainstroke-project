<!DOCTYPE html>
<html>

<head>

    <title>Stroke Prediction Result</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .model {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }

        .percent {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .risk-high {
            background: #ffe5e5;
            color: #e74c3c;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .risk-low {
            background: #eafaf1;
            color: #27ae60;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        .progress {
            height: 10px;
            background: #ddd;
            border-radius: 6px;
            flex: 1;
            margin: 0 10px;
            overflow: hidden;
        }

        .fill {
            height: 10px;
            background: #4facfe;
        }

        .buttons {
            margin-top: 20px;
        }

        .buttons a {
            display: block;
            margin: 10px 0;
            padding: 12px;
            background: #4facfe;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .buttons a:hover {
            background: #3a8de0;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Stroke Prediction Result</h2>

        <!-- <div class="model">
            Model Used: <b>{{model}}</b>
        </div> -->

        <div class="percent">
            Stroke Risk: {{risk}}%
        </div>

        {% if prediction==1 %}

        <div class="risk-high">
            ⚠ High Stroke Risk
        </div>

        {% else %}

        <div class="risk-low">
            ✔ Low Stroke Risk
        </div>

        {% endif %}

        <!-- Risk Visualization -->

        <!-- <div class="bar">
            Low
            <div class="progress">
                <div class="fill" style="width:30%"></div>
            </div>
            30%
        </div>

        <div class="bar">
            Medium
            <div class="progress">
                <div class="fill" style="width:50%"></div>
            </div>
            50%
        </div>

        <div class="bar">
            High
            <div class="progress">
                <div class="fill" style="width:{{risk}}%"></div>
            </div>
            {{risk}}%
        </div> -->

        <div class="buttons">

            <a href="/dashboard">Predict Again</a>

            <a href="/logout">Logout</a>

        </div>

    </div>

</body>

</html>
