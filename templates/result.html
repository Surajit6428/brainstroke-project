<!DOCTYPE html>
<html>

<head>

    <title>Stroke Prediction Result</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .percent {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* 🔥 Risk Styles */
        .risk-high {
            background: #ffe5e5;
            color: #e74c3c;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .risk-medium {
            background: #fff4e5;
            color: #f39c12;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .risk-low {
            background: #eafaf1;
            color: #27ae60;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .buttons {
            margin-top: 20px;
        }

        .buttons a {
            display: block;
            margin: 10px 0;
            padding: 12px;
            background: #4facfe;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .buttons a:hover {
            background: #3a8de0;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Stroke Prediction Result</h2>

        <div class="percent">
            Stroke Risk: {{risk}}%
        </div>

        <!-- 🔥 NEW LOGIC BASED ON LEVEL -->

        {% if level == "High" %}
            <div class="risk-high">
                ⚠ High Stroke Risk
            </div>

        {% elif level == "Medium" %}
            <div class="risk-medium">
                ⚠ Medium Stroke Risk
            </div>

        {% else %}
            <div class="risk-low">
                ✔ Low Stroke Risk
            </div>
        {% endif %}

        <div class="buttons">
            <a href="/dashboard">Predict Again</a>
            <a href="/logout">Logout</a>
        </div>

    </div>

</body>

</html>
