<!DOCTYPE html>
<html>

<head>
<title>User Profile</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
padding:30px;
border-radius:12px;
width:90%;
max-width:450px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
text-align:center;
}

.avatar{
width:70px;
height:70px;
background:#4facfe;
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:bold;
margin:auto;
margin-bottom:15px;
}

h2{
margin-bottom:20px;
color:#2c3e50;
}

label{
font-weight:bold;
display:block;
margin-top:10px;
text-align:left;
}

input{
width:100%;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
margin-top:5px;
}

.strength{
font-size:12px;
margin-top:5px;
text-align:left;
}

.msg{
padding:10px;
margin-bottom:15px;
border-radius:6px;
font-weight:bold;
text-align:left;
}

.msg.error{
background:#ffe6e6;
color:red;
}

.msg.success{
background:#e6ffe6;
color:green;
}

.error{
color:red;
font-size:13px;
margin-top:5px;
text-align:left;
}

button{
margin-top:15px;
width:100%;
padding:12px;
background:#4facfe;
border:none;
color:white;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#3a8de0;
}

.back{
text-align:center;
margin-top:10px;
}

.back a{
text-decoration:none;
color:#4facfe;
font-weight:bold;
}
</style>

<script>

// 🔥 strength checker
function checkStrength(){
let pass=document.getElementById("new_password").value
let strength=document.getElementById("strength")

let strong=/((?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@$!%*?&]))/

if(pass.length==0){
strength.innerHTML=""
}
else if(pass.length<6){
strength.innerHTML="Weak Password"
strength.style.color="red"
}
else if(strong.test(pass)){
strength.innerHTML="Strong Password"
strength.style.color="green"
}
else{
strength.innerHTML="Medium Password"
strength.style.color="orange"
}
}

// 🔥 validation
function validateForm(){

let oldPass = document.querySelector('input[name="old_password"]').value
let newPass = document.getElementById("new_password").value
let confirmPass = document.getElementById("confirm_password").value
let error = document.getElementById("error")

if(oldPass === ""){
error.innerHTML = "❌ Enter old password"
return false
}

if(newPass === ""){
error.innerHTML = "❌ Enter new password"
return false
}

if(newPass !== confirmPass){
error.innerHTML = "❌ Password does not match"
return false
}

error.innerHTML = ""
return true
}
</script>

</head>

<body>

<div class="container">

<div class="avatar">
{{ user.first_name[0]|upper }}{{ user.last_name[0]|upper }}
</div>

<h2>User Profile</h2>

{% if message %}
  {% if "Incorrect" in message %}
    <div class="msg error">{{ message }}</div>
  {% else %}
    <div class="msg success">{{ message }}</div>
  {% endif %}
{% endif %}

<form action="/update_profile" method="post" onsubmit="return validateForm()">

<label>First Name</label>
<input type="text" name="first_name" value="{{ user.first_name or '' }}" required>

<label>Middle Name</label>
<input type="text" name="middle_name" value="{{ user.middle_name or '' }}">

<label>Last Name</label>
<input type="text" name="last_name" value="{{ user.last_name or '' }}" required>

<label>Username</label>
<input type="text" name="username" value="{{ user.username }}" readonly>

<label>Email</label>
<input type="email" name="email" value="{{ user.email or '' }}">

<label>Enter Old Password</label>
<input type="password" name="old_password">

<label>Enter New Password</label>
<input type="password" id="new_password" name="new_password" onkeyup="checkStrength()">

<div id="strength" class="strength"></div>

<label>Re-enter New Password</label>
<input type="password" id="confirm_password">

<div id="error" class="error"></div>

<button type="submit">Update Profile</button>

</form>

<div class="back">
<a href="/dashboard">⬅ Back to Dashboard</a>
</div>

</div>

</body>
</html>
