<!DOCTYPE html>
<html>

<head>
    <title>User Profile</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --subtext: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --subtext: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            position: relative;
        }

        /* Overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.6);
            z-index: -1;
        }

        body.dark::before {
            background: rgba(15,23,42,0.75);
        }

        /* NAVBAR */
        .navbar {
            background: var(--card);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .navbar h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .icon-btn, .toggle {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            cursor: pointer;
            transition: 0.25s;
        }

        .icon-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        .icon-btn:hover svg { stroke: white; }

        .logout-btn:hover { background: var(--danger); }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--primary);
        }

        .toggle { font-size: 18px; }

        /* CONTAINER */
        .container {
            max-width: 950px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
        }

        /* PROFILE */
        .profile-top {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg,var(--primary),var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 22px;
        }

        .profile-info h3 { margin: 0; }
        .profile-info p { margin: 4px 0 0; color: var(--subtext); }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full { grid-column: span 2; }

        label { font-size: 12px; color: var(--subtext); }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-top: 6px;
            font-size: 14px;
            background: transparent;
            color: var(--text);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
            outline: none;
        }

        /* MESSAGE */
        .msg {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .msg.error {
            background: rgba(239,68,68,0.1);
            color: var(--danger);
        }

        .msg.success {
            background: rgba(34,197,94,0.1);
            color: var(--success);
        }

        .error {
            color: var(--danger);
            margin-top: 10px;
        }

        /* BUTTON */
        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg,var(--primary),var(--primary-dark));
            border: none;
            color: white;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99,102,241,0.4);
        }

        /* POPUP */
        .popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .popup-box {
            background: var(--card);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 320px;
            animation: pop 0.25s ease;
        }

        @keyframes pop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .popup-btns button { flex: 1; }

        .popup-btns .cancel {
            background: var(--border);
            color: var(--text);
        }

        /* MOBILE */
        @media(max-width:600px){
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: span 1; }
        }
    </style>

    <script>
        function toggleTheme() {
            document.body.classList.toggle("dark");
            localStorage.setItem("theme",
                document.body.classList.contains("dark") ? "dark" : "light");
            updateIcon();
        }

        function updateIcon() {
            document.getElementById("themeIcon").innerHTML =
                document.body.classList.contains("dark") ? "☀" : "🌙";
        }

        window.onload = function () {
            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark");
            }
            updateIcon();
        }

        function checkStrength() {
            let pass = document.getElementById("new_password").value
            let strength = document.getElementById("strength")
            let strong = /((?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@$!%*?&]))/

            if (pass.length == 0) strength.innerHTML = ""
            else if (pass.length < 6) { strength.innerHTML = "Weak"; strength.style.color = "red" }
            else if (strong.test(pass)) { strength.innerHTML = "Strong"; strength.style.color = "green" }
            else { strength.innerHTML = "Medium"; strength.style.color = "orange" }
        }

        function validateForm() {
            let oldPass = document.querySelector('input[name="old_password"]').value
            let newPass = document.getElementById("new_password").value
            let confirmPass = document.getElementById("confirm_password").value
            let error = document.getElementById("error")

            if (oldPass === "") return error.innerHTML = "❌ Enter old password", false
            if (newPass === "") return error.innerHTML = "❌ Enter new password", false
            if (newPass !== confirmPass) return error.innerHTML = "❌ Password does not match", false

            error.innerHTML = ""
            return true
        }

        function openLogoutPopup() {
            document.getElementById("logoutPopup").style.display = "flex";
        }

        function closeLogoutPopup() {
            document.getElementById("logoutPopup").style.display = "none";
        }

        function confirmLogout() {
            window.location.href = "/logout";
        }
    </script>

</head>

<body>

    <div class="navbar">
        <h2>Brainstroke Prediction</h2>

        <div class="nav-links">

            <div class="icon-btn" onclick="location.href='/dashboard'">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" />
                    <rect x="14" y="3" width="7" height="7" />
                    <rect x="14" y="14" width="7" height="7" />
                    <rect x="3" y="14" width="7" height="7" />
                </svg>
            </div>

            <div class="icon-btn" onclick="location.href='/history'">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <path d="M3 3v5h5" />
                    <path d="M3.05 13A9 9 0 1 0 6 5.3" />
                    <polyline points="12 7 12 12 15 14" />
                </svg>
            </div>

            <div class="icon-btn logout-btn" onclick="openLogoutPopup()">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </div>

            <div class="toggle" onclick="toggleTheme()" id="themeIcon">🌙</div>

        </div>
    </div>

    <div class="container">
        <div class="card">

            <div class="profile-top">
                <div class="avatar">
                    {{ user.first_name[0]|upper }}{{ user.last_name[0]|upper }}
                </div>
                <div class="profile-info">
                    <h3>{{ user.first_name }} {{ user.last_name }}</h3>
                    <p>{{ user.email }}</p>
                </div>
            </div>

            {% if message %}
            {% if "Incorrect" in message %}
            <div class="msg error">{{ message }}</div>
            {% else %}
            <div class="msg success">{{ message }}</div>
            {% endif %}
            {% endif %}

            <form action="/update_profile" method="post" onsubmit="return validateForm()">
                <div class="grid">

                    <div>
                        <label>First Name</label>
                        <input type="text" name="first_name" value="{{ user.first_name or '' }}" required>
                    </div>

                    <div>
                        <label>Middle Name</label>
                        <input type="text" name="middle_name" value="{{ user.middle_name or '' }}">
                    </div>

                    <div>
                        <label>Last Name</label>
                        <input type="text" name="last_name" value="{{ user.last_name or '' }}" required>
                    </div>

                    <div>
                        <label>Username</label>
                        <input type="text" name="username" value="{{ user.username }}" readonly>
                    </div>

                    <div class="full">
                        <label>Email</label>
                        <input type="email" name="email" value="{{ user.email or '' }}">
                    </div>

                    <div class="full">
                        <label>Old Password</label>
                        <input type="password" name="old_password">
                    </div>

                    <div>
                        <label>New Password</label>
                        <input type="password" id="new_password" name="new_password" onkeyup="checkStrength()">
                        <div id="strength" class="strength"></div>
                    </div>

                    <div>
                        <label>Confirm Password</label>
                        <input type="password" id="confirm_password">
                    </div>

                </div>

                <div id="error" class="error"></div>

                <button type="submit">Update Profile</button>
            </form>

        </div>
    </div>

    <div id="logoutPopup" class="popup">
        <div class="popup-box">
            <p>Are you sure you want to logout?</p>
            <div class="popup-btns">
                <button onclick="confirmLogout()">Yes</button>
                <button onclick="closeLogoutPopup()" class="cancel">No</button>
            </div>
        </div>
    </div>

</body>
</html>
