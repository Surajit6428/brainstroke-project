<!DOCTYPE html>
<html>

<head>
    <title>Brainstroke Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
        }

        /* FULL BACKGROUND IMAGE */
        .hero {
            height: 100vh;
            width: 100%;
            background: 
                linear-gradient(to right, rgba(248,250,252,0.95) 30%, rgba(248,250,252,0.2)),
                url("{{ url_for('static', filename='stroke.png') }}");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 60px;
        }

        .content {
            max-width: 500px;
        }

        h1 {
            font-size: 48px;
            color: #334155;
            line-height: 1.2;
        }

        /* ✨ Cursor Effect */
        #typing::after {
            content: "|";
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }

        p {
            margin-top: 15px;
            font-size: 18px;
            color: #64748b;
        }

        .btn {
            margin-top: 25px;
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        /* MOBILE */
        @media(max-width: 768px) {
            .hero {
                padding: 30px;
                background-position: right;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="hero">
    <div class="content">

        <!-- ✨ Typing Text -->
        <h1>
            <span id="typing"></span>
        </h1>

        <p>Check your health instantly</p>

        <button class="btn" onclick="goLogin()">Get Started</button>
    </div>
</div>

<script>
function goLogin() {
    window.location.href = "/login";
}

/* ✨ Typing Effect */
const text = "Brain Stroke Prediction System";
let index = 0;

function typeEffect() {
    if (index < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeEffect, 60);
    }
}

window.onload = typeEffect;
</script>

</body>
</html>
