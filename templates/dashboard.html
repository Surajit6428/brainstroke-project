<!DOCTYPE html>
<html>

<head>
    <title>Stroke Prediction Dashboard</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --primary: #4facfe;
            --secondary: #00c6ff;
            --card: rgba(255,255,255,0.95);
            --dark-card: rgba(22,27,34,0.95);
            --border: rgba(255,255,255,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
        }

        /* BACKGROUND */
        body {
            background: url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.7);
            z-index: 0;
        }

        body.dark::before {
            background: rgba(0,0,0,0.75);
        }

        /* NAVBAR */
        .navbar {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            position: relative;
        }

        .dark .navbar {
            background: rgba(22,27,34,0.85);
            color: white;
        }

        .nav-links a {
            margin-left: 12px;
            font-size: 18px;
            color: var(--primary);
            text-decoration: none;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(79, 172, 254, 0.1);
            transition: 0.3s;
        }

        .nav-links a:hover {
            transform: translateY(-3px);
            background: var(--primary);
            color: white;
        }

        .toggle-btn {
            cursor: pointer;
            margin-left: 15px;
            font-size: 18px;
        }

        /* MAIN */
        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 18px;
            margin-top: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            border: 1px solid var(--border);
        }

        .dark .card {
            background: var(--dark-card);
            color: white;
        }

        .sub {
            margin-bottom: 20px;
            color: #6b7280;
        }

        .dark .sub {
            color: #9ca3af;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-top: 5px;
            background: rgba(255,255,255,0.6);
            transition: 0.25s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,172,254,0.2);
            outline: none;
        }

        .dark input, .dark select {
            background: #0d1117;
            color: white;
            border: 1px solid #30363d;
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        /* POPUP */
        .logout-popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .popup-box {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            width: 300px;
            animation: pop 0.25s ease;
        }

        .dark .popup-box {
            background: #161b22;
            color: white;
        }

        @keyframes pop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-box p {
            margin-bottom: 15px;
            font-size: 15px;
        }

        .popup-box button {
            margin: 5px;
            width: 45%;
        }

        .yes {
            background: #ef4444;
        }

        .no {
            background: #6b7280;
        }

        /* MOBILE */
        @media(max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }
        }

    </style>
</head>

<body>

    <div class="navbar">
        <h2>Brainstroke Prediction</h2>

        <div class="nav-links">
            <a href="/profile"><i class="fa-solid fa-user"></i></a>

            <a href="/history">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </a>

            <a href="#" onclick="openLogout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </a>

            <span class="toggle-btn"
                id="modeIcon"
                onclick="toggleMode()">☀</span>
        </div>
    </div>

    <div class="container">

        <div class="card">

            <h3>Stroke Prediction Dashboard</h3>

            <p class="sub">
                Welcome <b>{{user.first_name}}</b>
            </p>

            <form action="/auto_predict" method="post">

                <div class="grid">

                    <div>
                        <label>gender</label>

                        <select name="param" required>

                            <option value="" disabled selected>Select</option>

                            <option value="1">Male</option>

                            <option value="0">Female</option>

                        </select>
                    </div>

                    <div>
                        <label>age</label>

                        <input 
                        type="number"
                        min="1"
                        max="120"
                        name="param"required>
                    </div>

                    <div>
                        <label>hypertension</label>

                        <select name="param" required>

                            <option value="" disabled selected>Select</option>

                            <option value="0">No</option>

                            <option value="1">Yes</option>

                        </select>
                    </div>

                    <div>
                        <label>heart_disease</label>

                        <select name="param" required>

                            <option value="" disabled selected>Select</option>

                            <option value="0">No</option>

                            <option value="1">Yes</option>

                        </select>
                    </div>

                    <div>
                        <label>ever_married</label>

                        <select name="param" required>

                            <option value="" disabled selected>Select</option>

                            <option value="0">No</option>

                            <option value="1">Yes</option>

                        </select>
                    </div>

                    <div>
                        <label>work_type</label>

                        <select name="param" required>

                            <option value="" disabled selected>Select</option>

                            <option value="0">Children</option>

                            <option value="1">Private</option>

                            <option value="2">Never Worked</option>

                            <option value="3">Self Employed</option>

                            <option value="4">Government Job</option>

                        </select>
                    </div>

                    <div>
                        <label>Residence_type</label>

                        <select name="param" required>

                            <option value="" disabled selected>Select</option>

                            <option value="0">Rural</option>

                            <option value="1">Urban</option>

                        </select>
                    </div>

                    <!-- GLUCOSE LEVEL -->

                    <div class="full">

                        <label>
                            avg_glucose_level 
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            min="20"
                            max="600"
                            placeholder="Enter value between 20 - 600"
                            name="param"
                            required>

                    </div>

                    <!-- BMI -->

                    <div class="full">

                        <label>
                            bmi 
                        </label>

                        <input
                            type="number"
                            step="0.1"
                            min="8"
                            max="120"
                            placeholder="Enter value between 8 - 120"
                            name="param"
                            required>

                    </div>

                    <div>
                        <label>smoking_status</label>

                        <select name="param" required>

                            <option value="" disabled selected>Select</option>

                            <option value="0">Unknown</option>

                            <option value="1">Never Smoked</option>

                            <option value="2">Formerly Smoked</option>

                            <option value="3">Smokes</option>

                        </select>
                    </div>

                </div>

                <button type="submit">
                    Predict Stroke Risk
                </button>

            </form>

        </div>

    </div>

    <div class="logout-popup" id="logoutBox">

        <div class="popup-box">

            <p>
                Are you sure you want to logout?
            </p>

            <button class="yes" onclick="goLogout()">
                Yes
            </button>

            <button class="no" onclick="closeLogout()">
                No
            </button>

        </div>

    </div>

    <script>

        function toggleMode() {

            let body = document.body;

            let icon =
                document.getElementById("modeIcon");

            body.classList.toggle("dark");

            icon.innerHTML =
                body.classList.contains("dark")
                ? "🌙"
                : "☀";
        }

        function openLogout() {

            document.getElementById("logoutBox")
            .style.display = "flex";
        }

        function closeLogout() {

            document.getElementById("logoutBox")
            .style.display = "none";
        }

        function goLogout() {

            window.location.href = "/logout";
        }

    </script>

</body>

</html>
